# Example nginx configuration for local testing
# Copy this file to /etc/nginx/sites-enabled/ or include it in your nginx.conf
# Adjust the root path to point to the 'pages' directory of this project

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Update this path to the absolute path of the 'pages' directory
    root /path/to/wizytowka/pages;
    index index.html index.php;

    ssl_certificate     /path/to/wizytowka/local_test/ssl/localhost.crt;
    ssl_certificate_key /path/to/wizytowka/local_test/ssl/localhost.key;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000; # assumes php-fpm listens here
    }
}
